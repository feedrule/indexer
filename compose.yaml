name: indexer

# Shared by the indexer services (input, proposals, check, export, cleanup, undo, drop-tables): one image, the
# database settings, and the hardening for a process that handles untrusted content.
x-indexer: &indexer
  build:
    context: .
    dockerfile: Dockerfile
  image: indexer:0.1.0
  depends_on:
    postgres:
      condition: service_healthy
    liquibase:
      condition: service_completed_successfully # the schema is up to date first
  environment:
    # Local postgres by default, with the password from POSTGRES_PASSWORD (.env). CI sets
    # DATABASE_URL (a URL or libpq keyword string) and PGPASSWORD for Supabase, and runs with
    # `--no-deps` so the local database never starts.
    DATABASE_URL: ${DATABASE_URL:-postgresql://indexer@postgres:5432/indexer}
    PGPASSWORD: ${PGPASSWORD:-${POSTGRES_PASSWORD:-}}
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_DB: indexer
      POSTGRES_USER: indexer
      # local development only: set it in .env (see .env.example); never committed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432" # never exposed beyond this machine
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer -d indexer"]
      interval: 2s
      timeout: 3s
      retries: 30

  liquibase:
    build:
      context: src/indexer/db/liquibase
      dockerfile: liquibase.Dockerfile
    image: indexer-liquibase:5.0.4-pg42.7.14
    depends_on:
      postgres:
        condition: service_healthy
    # Defaults target the local postgres service. CI points these at Supabase and runs with
    # `docker compose run --no-deps` so the local database is never started there.
    environment:
      LIQUIBASE_COMMAND_URL: ${LIQUIBASE_COMMAND_URL:-jdbc:postgresql://postgres:5432/indexer}
      LIQUIBASE_COMMAND_USERNAME: ${LIQUIBASE_COMMAND_USERNAME:-indexer}
      LIQUIBASE_COMMAND_PASSWORD: ${LIQUIBASE_COMMAND_PASSWORD:-${POSTGRES_PASSWORD:-}}
    volumes:
      - ./src/indexer/db/liquibase/changelog:/liquibase/changelog:ro
    command: ["--changelog-file=db.changelog-master.yaml", "update"]

  # Loads every URL from the lists in data/sources.toml into the inputs table and exits.
  # Safe to re-run: new URLs are added, nothing is deleted, and a URL's source changes only
  # to a more permissive license.
  input:
    <<: *indexer
    volumes:
      - ./data:/work/data:ro
    command: ["load-inputs", "data/sources.toml"]

  # Proposes feeds from a ~5-year-old Common Crawl crawl that are still active today: writes
  # them to a new data/survivors/<yyyymm>/<dd-HHMMSS>.yaml (for a pull request) and output/proposals.md. Locally:
  #   mkdir -p output && HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose run --rm proposals
  proposals:
    <<: *indexer
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}" # owns what it writes
    volumes:
      - ./data:/work/data:ro
      - ./data/survivors:/work/data/survivors # the proposals it writes
      - ./data/models:/work/data/models # the proposal filter it trains once per review (git-ignored)
      - ./output:/work/output # the pull request report
    command: ["proposals", "--report", "output/proposals.md"]

  # Checks a URL file in ./data, or the most outdated inputs, and exits.
  #   docker compose run --rm check                                   # data/urls.txt
  #   docker compose run --rm check run --from-inputs --batch 50 -v
  check:
    <<: *indexer
    volumes:
      - ./data:/work/data:ro
    command: ["run", "data/urls.txt"]

  # Writes the published lists to ./output (cleared first) and the posts files into ./posts (a
  # checkout of the posts branch, or an empty directory), and exits:
  #   mkdir -p output posts && HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose run --rm export
  # Runs as your user so the files are yours; create both first, or Docker creates them as root.
  export:
    <<: *indexer
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}"
    volumes:
      - ./output:/work/output
      - ./posts:/work/posts
      - ./SPEC.md:/work/SPEC.md:ro
      - ./data/topics/synonyms.tsv:/work/data/topics/synonyms.tsv:ro
    command: ["export", "--output-dir", "output", "--posts-dir", "posts"]

  # Rebuilds the embedding sets in data/embeddings/ (the set "topics" from data/topics/topics.txt)
  # with the image's MiniLM. No database, no network:
  #   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose run --rm embeddings
  embeddings:
    build:
      context: .
      dockerfile: Dockerfile
    image: indexer:0.1.0
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}" # owns what it writes
    volumes:
      - ./data:/work/data:ro # the sources
      - ./data/embeddings:/work/data/embeddings # the sets (indexer embeddings)
    command: ["embeddings"]

  # Clusters the sentences of recent posts into data/clusters/ (clusters.yml pushes them to the
  # binaries branch): the posts files of a checkout of the posts branch in ./published, and the
  # rejected survivors in data/survivors. No database, no network; the text is untrusted.
  #   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose run --rm clusters
  clusters:
    build:
      context: .
      dockerfile: Dockerfile
    image: indexer:0.1.0
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}" # owns what it writes
    volumes:
      - ./data:/work/data:ro # the proposal files and sources.toml
      - ./published/data/posts:/work/posts:ro # the posts branch's data/posts/
      - ./data/clusters:/work/data/clusters # what it writes
    command: ["clusters", "--posts", "posts"]

  # Deletes every indexer table and all data (needs --yes); the next liquibase run recreates
  # them empty:  docker compose run --rm drop-tables drop-tables --yes
  drop-tables:
    <<: *indexer
    command: ["drop-tables"] # refuses without --yes

  # Deletes the URLs in data/undo.txt from inputs, health_checks and feeds; reports what it
  # deleted and what it did not find.
  undo:
    <<: *indexer
    volumes:
      - ./data/undo.txt:/work/data/undo.txt:ro
    command: ["undo", "data/undo.txt"]

  # Deletes health checks older than 8 months and exits. feeds and inputs are kept.
  cleanup:
    <<: *indexer
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}"
    volumes:
      - ./report:/work/report # cleanup.yml: the size report, when over the threshold
    command: ["cleanup", "--months", "8"]

volumes:
  pgdata:
