# Publishes the lists after every successful check run, on a push to develop that changes
# the publish package (src/indexer/publish/), weekly as a fallback, or by hand:
# regenerates output/ from Supabase (feeds with a successful check in
# the last 6 months and a post in the last year, every topic) and force-pushes it as a single
# fresh commit to the `output` branch. The branch has no history: each publish replaces it.
# workflow_run triggers only use this file as it is on the default branch.
#
# The feeds' recent posts go to the `posts` branch instead (one file per feed, written when its
# posts change; the previews link to it), pushed first and normally: files are never deleted
# or rewritten from scratch, so that branch is never force-pushed. Publishes queue (one
# concurrency group) so two pushes never race. The container gets the branch's files without
# its .git directory (moved aside), so nothing it writes runs on the runner.
#
# It reads the database and writes text; it never fetches feeds. Uses the same SUPABASE_DB_* secrets as input.yml.
name: publish

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays
  push: # a change to what is published or how the site looks
    branches: [develop]
    paths:
      - src/indexer/publish/**
  workflow_dispatch:
  workflow_run: # right after a check run, so the published lists follow the database
    workflows: [check]
    types: [completed]

permissions:
  contents: write # to push the output and posts branches

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Not after a failed or cancelled check run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://${{ secrets.SUPABASE_DB_HOST }}:${{ secrets.SUPABASE_DB_PORT }}/${{ secrets.SUPABASE_DB_NAME }}?sslmode=require
      LIQUIBASE_COMMAND_USERNAME: ${{ secrets.SUPABASE_DB_USER }}
      LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DATABASE_URL: >-
        host=${{ secrets.SUPABASE_DB_HOST }} port=${{ secrets.SUPABASE_DB_PORT }}
        dbname=${{ secrets.SUPABASE_DB_NAME }} user=${{ secrets.SUPABASE_DB_USER }}
        sslmode=require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build images
        run: docker compose build liquibase export

      - name: Migrate schema
        run: docker compose run --rm --no-deps -T liquibase

      - name: Check out the posts branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: posts
          path: posts
          persist-credentials: false

      - name: Export
        run: |
          mkdir -p output
          mv posts/.git posts.git
          HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run --rm --no-deps -T export

      - name: Push to the posts branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf posts/.git
          git() { command git --git-dir=posts.git --work-tree=posts "$@"; }
          git add -A
          if git diff --cached --quiet; then
            echo "No posts changed"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "Recent posts, $(date -u +%F)"
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:posts
          fi

      - name: Force-push to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish feeds by topic, $(date -u +%F)"
          git push --force -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output:output
