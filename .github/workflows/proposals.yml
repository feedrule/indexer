# Proposes feeds from a ~5-year-old Common Crawl crawl that are still active, weekly or by hand:
# reads the first 25 MB (input slice-mb) of one random WAT file, checks every feed found, and
# writes the ones that pass to a new data/proposals/<yyyymm>/<dd-HHMMSS>.yaml (UTC), with its
# .opml and .summary.md, on a new orphan branch holding only those three files. Nothing is
# inserted here: the daily input job checks out the proposals branch and loads the feeds marked
# accept: true.
#
# Every proposing run reads the proposals branch (to skip known URLs) and pushes its own orphan
# branch, proposals-<UTC timestamp>: one commit with only that run's files, no history. No pull
# request is opened (a PR keeps its commits on GitHub forever, so the repository could never shrink): the
# operator reviews the file on the branch, squash-merges it into proposals and deletes the
# branch, as the summary file says. Reads the inputs table (to skip known URLs) with the
# SUPABASE_DB_* secrets. The containers get the branch's data/proposals/ only, never its .git;
# commits and pushes happen on the runner.
name: proposals

on:
  schedule:
    - cron: "11 4 * * 3" # Wednesdays
  workflow_dispatch:
    inputs:
      slice-mb:
        description: MB to read from the start of one random WAT file
        type: number
        default: 25
      years-ago:
        description: Use the crawl that ended closest to this many years ago
        type: number
        default: 5
      active-days:
        description: Keep feeds with a tagged post in this many days
        type: number
        default: 243 # about 8 months
      max-feeds:
        description: Stop once this many new feeds pass
        type: number
        default: 20

permissions:
  contents: write # to push the run's proposals-<timestamp> branch

concurrency:
  group: indexer-db
  cancel-in-progress: false

jobs:
  proposals:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://${{ secrets.SUPABASE_DB_HOST }}:${{ secrets.SUPABASE_DB_PORT }}/${{ secrets.SUPABASE_DB_NAME }}?sslmode=require
      LIQUIBASE_COMMAND_USERNAME: ${{ secrets.SUPABASE_DB_USER }}
      LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DATABASE_URL: >-
        host=${{ secrets.SUPABASE_DB_HOST }} port=${{ secrets.SUPABASE_DB_PORT }}
        dbname=${{ secrets.SUPABASE_DB_NAME }} user=${{ secrets.SUPABASE_DB_USER }}
        sslmode=require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      # Scheduled runs have no inputs: fall back to the defaults. Passed through the
      # environment, never pasted into the script.
      SLICE_MB: ${{ inputs.slice-mb || 25 }}
      YEARS_AGO: ${{ inputs.years-ago || 5 }}
      ACTIVE_DAYS: ${{ inputs.active-days || 243 }}
      MAX_FEEDS: ${{ inputs.max-feeds || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false

      - name: Check out the proposals branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: proposals
          path: proposals
          persist-credentials: false

      - name: Build images
        run: docker compose build liquibase proposals

      - name: Migrate schema
        run: docker compose run --rm --no-deps -T liquibase

      - name: Find feeds to propose
        run: |
          mkdir -p output data/models data/proposals
          HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run --rm --no-deps -T proposals \
            proposals --report output/proposals.md --slice-mb "$SLICE_MB" \
            --years-ago "$YEARS_AGO" --active-days "$ACTIVE_DAYS" --max-feeds "$MAX_FEEDS"

      - name: Propose them
        run: |
          cd proposals
          file="$(git ls-files --others --exclude-standard 'data/proposals/*.yaml')"
          opml="${file%.yaml}.opml"
          if [ -z "$file" ]; then
            echo "Nothing new to propose."
            exit 0
          fi
          stamp="$(basename "$(dirname "$file")")$(basename "$file" .yaml)" # yyyymmdd-HHMMSS, UTC
          branch="proposals-$stamp"
          summary="${file%.yaml}.summary.md"
          {
            echo "# Feeds from Common Crawl, $stamp"
            echo
            echo "Feeds from a ~5-year-old Common Crawl crawl that are still active, proposed in"
            echo "[\`$(basename "$file")\`]($(basename "$file")) by one proposals run, on the branch \`$branch\`."
            echo "Every feed starts at accept: false."
            echo
            echo "**To review**"
            echo
            echo "- [Edit the file]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/edit/$branch/$file) on the branch:"
            echo "  set \`accept: true\` on each feed to keep, and commit."
            echo "- To try them in a feed reader, download [\`$(basename "$opml")\`]($(basename "$opml"))"
            echo "  and import it."
            echo "- Then merge and delete the branch (or only delete it, to drop them all):"
            echo
            echo '  ```sh'
            echo "  git fetch origin && git switch proposals && git pull --ff-only"
            echo "  git merge --squash --allow-unrelated-histories origin/$branch && git commit -m \"Feeds from Common Crawl, $stamp\""
            echo "  git push origin proposals && git push origin --delete $branch"
            echo '  ```'
            echo
            cat ../output/proposals.md
          } > "$summary"
          # Orphan: the branch holds only this run's files (tracked files leave the index and
          # the work tree; the new, untracked ones stay).
          git switch -q --orphan "$branch"
          git add "$file" "$opml" "$summary"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              -c core.hooksPath=/dev/null \
              commit -q -m "Propose feeds from Common Crawl, $stamp"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch:$branch"
          { # the file's links are relative: they work on the branch, not on the run's page
            echo "Review on the branch: [\`$summary\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$branch/$summary)"
            echo
            cat "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
