    date: 2026-10-20
    title: We Didn’t Call it a Funeral
    description:
      - My grandparents didn’t want a funeral. When my grandma died
      - unexpectedly, my grandpa was adamant about this request, and
      - when he died a decade later, it was still ringing in our
      - ears. So we didn’t have a service. Didn’t gather what surely
      - would have been hundreds of people who wanted to say
      - goodbye, or to tell one of us—their children, grandchildren,
      - great grandchildren—how special they were. But they didn’t
      - have to, because I knew. Ever since I was little, I knew.
      - And I think it will be a long time before I stop running
      - into people who remind me. Old friends or passing
      - acquaintances whose day was made brighter or whose path was
      - set right just by being around my grandma and grandpa. There
      - are people I’ve never met, and people I knew but no longer
      - see that carry around memories of my grandma and grandpa,
      - smiling as they think, every once in a while, they were so
      - great. So we had a funeral. Not the big, bustling kind. Not
      - the crowded, catered kind. And not the immediate, aftermath
      - kind.
