recent_posts:
  - link: https://www.anthonygladman.com/always-burning-150-years-of-the-carlsberg-research-laboratory/
    date: 2026-11-05
    title: 'Always Burning: 150 Years of the Carlsberg Research Laboratory'
    description:
      - This piece is shortlisted for Best Commissioned Beer Writing
      - at the British Guild of Beer Writers Awards 2026, so it
      - seemed a good moment to set it free from behind the paywall.
      - It first appeared in Brewer and Distiller International in
      - January/February 2026, and my thanks go to Steve and the
      - team there for commissioning it and for letting me share it
      - 'here. Photo: Carlsberg Group / Daniel Urhøj Andersen We'
      - explore how this scientific powerhouse continues to
      - prioritise global progress over proprietary profit. As we
      - step inside the Carlsberg Research Laboratory, which
      - celebrated its 150th anniversary in 2025, we remember its
      - unique foundation structure – and that this was the facility
      - that gave the brewing world pure yeast and the pH scale – as
      - well as Zoran Gojkovic’s boundary-pushing experiments with
      - climate-resilient grains. But as you enter, it can mess with
