    title: macOS 27 Activates Mission Control when Dragging Files to Zight Menu Bar App
    description:
      - Since upgrading to macOS 27, dragging a file to the Zight
      - menu bar item (to upload it) would trigger Mission Control.
      - This got super annoying, and no settings stuff seems to have
      - really done anything to fix it. Even the one that is called
      - '"Drag windows to top of screen to enter Mission Control"'
      - didn't stop this, because I was dragging a file not a
      - window. (It did turn off dragging windows to the top
      - triggering Mission Control, as it says.) So… defaults write
      - com.apple.dock enterMissionControlByTopWindowDrag -bool
      - false;killall Dock Somehow, that seems to resolve the issue,
      - but it's strange because it's just toggling the same thing
      - 'as in the System Settings. Edit a few hours later: It worked'
      - for awhile, then stopped. So, scratch that. The best
      - work-around I've found is to open the Zight window/menu, and
      - drop items onto that as it's well below/away from the menu
      - bar. P.S. Dragging windows to the title bar does not bring
      - up Mission Control. Dragging files does. Grrrrr.
