    title: 'Brazil: Democracy Defended from Below'
    description:
      - MONTEVIDEO, Uruguay, November 27 (IPS) - Brazil’s President
      - Lula da Silva owes his fourth term less to his campaign than
      - to the people who mobilised to stop his far-right opponent.
      - Three weeks after losing the first round, the 80-year-old
      - was elected for another term in the 25 October runoff with
      - around 52 per cent of the valid vote. This was the first
      - such comeback since Brazil’s return to democracy. Online
      - activists, students, trade unionists and millions of voters
      - who stayed home for the first round turned the result around
      - by mobilising on the streets, online and at the polls. The
      - question now is whether that mobilisation will last beyond
      - the electoral emergency, and whether it can help Lula push
      - his agenda through a Congress where the right holds the
      - 'upper hand. Read the full story, “Brazil: Democracy Defended'
