  - link: https://mdibl.org/sexual-dimorphism/
    date: 2026-11-16
    title: Sexual dimorphism
    links:
      nih.gov: 2
      nature.com: 1
      scientificamerican.com: 1
      wiley.com: 1
    description:
      - Scientists call the differences between males and females
      - that are not directly connected with reproduction sexual
      - dimorphism . A little more than a decade ago, a detailed
      - study quantified them in mice, finding that nearly 10% of
      - all measurable traits had different values in males and
      - females. In all, the researchers used data sets from 545
      - categorical traits — everything from body weight and size to
      - corneal opacity to gene function and much more — and found
      - that 54 were significantly influenced by sex. And yet, until
      - quite recently, most biomedical research was conducted
      - solely in male organisms, and even human clinical trial
      - participants were male biased. Not surprisingly, the skewed
      - data had consequences, and between 1997 and 2000 ten
