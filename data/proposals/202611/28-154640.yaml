      - bleeding. Both platelets and plasma proteins play important
      - roles in this process. Typically, blood clots spontaneously
      - dissolve following an injury. However, there are blood clots
      - that form without any apparent injury or do not dissolve
      - normally. The blood clot types depend on whether they occur
      - in the veins or arteries. Veins are the blood vessels that
      - transport deoxygenated blood away from the body’s organs and
      - back to the heart. Arteries are the blood vessels that carry
      - oxygenated blood away from the heart to the organs. A blood
      - clot in the leg(s), arm(s), pelvis, or major vein is called
      - deep vein thrombosis (DVT). Moreover, a blood clot that
      - forms in the arteries is called arterial thrombosis. Any
