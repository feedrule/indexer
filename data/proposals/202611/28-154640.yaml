    description:
      - Permafrost is not merely a climate indicator, but also a
      - living and dying surface—one that holds stories, secrets,
      - and signals for the future. Across the Arctic and sub-Arctic
      - regions, the frozen soil that has underpinned ecosystems,
      - Indigenous cultures, and scientific certainty for millennia
      - is thawing. Permafrost—once considered a stable, unmoving
      - archive of Earth’s climatic history—is now in flux,
      - collapsing both literally and symbolically under the weight
      - of global heating. This transformation is not only
      - geophysical; it is cultural, psychological, and political.
      - Melting permafrost releases greenhouse gases, awakens
      - dormant microorganisms, and disrupts traditional ways of
      - life. But it also raises deeper questions about memory,
      - loss, resilience, and how we relate to our changing planet.
      - In response to these urgent questions, Laser Talks Brussels
      - brings together artists and researchers whose practices
      - offer new ways of sensing and thinking through permafrost’s
      - material and metaphoric
