      - offering tea and coffee and a place for the village to chat
      - after laying the wreaths at the War Memorial. We were kept
      - busy, welcoming some new faces as well as many of our
      - members. We were delighted to meet with relatives of Wilfred
      - Smith. He was one of the fallen in WWI from Walkern. His
      - great neices had traced his history and had decided to
