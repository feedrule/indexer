    description:
      - What Is GERD? Gastroesophageal reflux disease (GERD), also
      - referred to as chronic acid reflux, is a digestive disorder
      - that occurs when stomach acid flows back into the esophagus.
      - When this happens repeatedly, then lining of the esophagus
      - becomes irritated and inflamed. GERD is one of the most
      - common gastrointestinal disorders worldwide. Its prevalence
      - varies across regions and populations, with research
      - indicating that the condition affects a substantial
      - proportion of adults globally. Some studies have also found
      - differences in prevalence between men and women. Early
      - diagnosis, appropriate treatment, and lifestyle
      - modifications can help manage symptoms and reduce the risk
      - of complications. What Causes GERD? Acid reflux occurs due
      - to the weakness or constant relaxation of the lower
      - esophageal sphincter (LES). When working properly, the LES
      - opens when allowing the food into the stomach and closes
      - once the food has been taken in. This prevents the food and
      - stomach acid from flowing back.
