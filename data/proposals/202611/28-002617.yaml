      - Black Friday is the name given to the shopping day following
      - Thanksgiving in the United States and is broadly understood
      - as the unofficial opening of the Christmas shopping season
      - for America. The phrase itself originated not in retail
      - circles but on city streets. Philadelphia police officers in
      - the 1950s and 1960s used it to describe the gridlock, packed
      - sidewalks, and general disorder that descended on the city
      - in the wake of Thanksgiving. A widely repeated explanation
      - holds that the name refers to stores crossing from financial
      - loss into profit, moving from “the red” into “the black.”
      - Retailers later adopted this framing enthusiastically, but
      - historians are in agreement that it was not where the term
      - came from. Black Friday always lands on the Friday after
      - Thanksgiving, which places it somewhere between November 23
      - and November 29 depending on the year. For many years, the
      - standard approach for serious bargain hunters was to arrive
      - before dawn or camp outside stores the night before
