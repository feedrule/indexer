      - prospect of being part of a project that featured northern
      - writers with stories based in my local area, and a sense of
      - flailing personal doubt. How was I going to write a story
      - with a hopeful ending in these difficult times? It was a
      - challenge. As I pursued the threads of the story, I realised
      - that the core had to be one of community spirit. I know that
      - sounds clichéd, but consider, along with the disasters
      - affecting so many areas around the world there are equally
