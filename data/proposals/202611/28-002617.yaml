      - 'Sapphire Heat Treatment: Scientific Understanding, Practical'
      - Experience, and Gemstone Value Sapphire Heat treatment is
      - one of the oldest and most widely accepted enhancement
      - practices in the gemstone industry. In sapphire, it is
      - especially important because many natural corundum crystals
      - contain hidden beauty that may not be fully visible when
      - they are first recovered from the ground. Some stones appear
      - milky, pale, dark, silky, or uneven in color, but their
      - internal chemistry may hold the potential for stronger blue,
      - golden yellow, or cleaner transparency. Heat treatment does
      - not create sapphire. It only modifies the appearance of an
      - existing natural sapphire by using heat to encourage changes
      - that can also happen slowly inside the Earth over geological
      - time. From a gemological point of view, sapphire is the
      - mineral corundum, composed mainly of aluminum oxide . Pure
      - corundum is colorless, but natural sapphire gains color from
      - trace elements and structural defects within the crystal. I
