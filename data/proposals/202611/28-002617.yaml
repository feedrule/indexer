    title: Shadow Row
    description:
      - On a sudden wave of secrets cast adrift on a sea of shadows
      - we row In parallel dimensions of our own facsimiles
      - creatures of creation unknown Are our deities, all too
      - painfully familiar are our demons Forever breaking silence
      - wrapped in hateful noise their wretched abuse Those who
      - stain our minds and hearts with their ghostly tears too dry
      - to speak Across the void of haunted streets and buildings
      - cross hatched trees and skies Remain somehow as backdrop
      - pictures of Now, this day to day of ill tide Foreboding
      - memory sepulchers that refuse to contain the unburied dead
      - eyes I can never follow their sinking anchors all the way
      - down suffocating thoughts Lie forsaken in that bottomless
      - trench condemned to visit, strange so sad to know On a
      - sudden wave of secrets cast adrift on a sea of shadows we
      - row
