      - a trained service animal in the cabin. Getting the code on
      - your reservation is the easy part; knowing the paperwork,
      - timing, and day-of-travel rules is what makes the trip go
      - smoothly. This guide explains what SVAN means, who
      - qualifies, and the steps to take from booking to touchdown.
