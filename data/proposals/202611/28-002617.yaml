    date: 2026-11-27
    title: '"File is locked for editing by another user" in Excel/Word: what do you check first?'
    description:
      - 'This one comes up a lot on the service desk: a user opens an'
      - Excel or Word file and gets “locked for editing by another
      - user”, sometimes with their own name in the message. The
      - 'check order I work through: Ask where the file lives: a'
      - network share or SharePoint/OneDrive. The fix path is
      - different. On a file share, look for a leftover owner file
      - (~$filename) in the same folder, and check open sessions on
      - the file server (Computer Management > Shared Folders > Open
      - Files) to close a stale handle. If the user’s own name
      - shows, look for a background Excel or Word process still
      - running on their PC in Task Manager and end it. In
      - SharePoint/OneDrive, check whether the file is checked out,
      - and whether it is an older format (.xls/.doc) that doesn’t
      - support co-authoring. What do you check first? And has
      - anyone found a reliable way to stop those ~$ owner files
      - from being left behind? 1 post - 1 participant Read full
      - topic
