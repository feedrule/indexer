    description:
      - (Photo by Stacy Revere/Getty Images) | Getty Images There
      - had been 1095 unique final scores in NFL history as of the
      - conclusion of the 2025 season. We are now up to 1099 with
      - the ones added during 2026. With teams scoring more points
      - in games, the extra point moving out to a 33-yard kick, and
      - teams deciding to go for two more often to gain edges,
      - never-before-seen final scores are still happening despite
      - the NFL playing for more than 100 years. These unique scores
      - are also called “Scorigami”. Many of the Scorigami we are
      - seeing are for 40-plus point games that have high scoring
      - from both teams, but we’ve also been seeing scores in the
      - 30s that have never happened. It’s not just high scores that
      - have never happened, though. A game has never finished in a
      - 2-2 tie, for instance. The NFL didn’t allow two-point
      - conversions until 1994, and we’ve never seen an 8-7 game. A
      - game has never ended in a 9-9 tie, among other scores still
      - out there. How may Scorigamis can we expect in 2026? Since
      - '199'
