      - in the left leg in France on 31st October 1914. He would
      - recover and serve throughout the remainder of the war, being
      - discharged in March 1919 after seven and a half years’
      - service. He would suffer from encephalitis lethargica in the
      - mid-1920s and be diagnosed with ‘Typical advanced
