[[source]]
name = "survivors"
license = "LicenseRef-CommonCrawl-ToU"
format = "proposals" # YAML, one document per feed; only feeds with accept: true are loaded
homepage = "https://github.com/feedrule/indexer/tree/develop/data/survivors"
notes = "Feeds from a ~5-year-old Common Crawl crawl that are still active, proposed weekly by the proposals workflow as a pull request and reviewed before merging."
files = ["survivors/*/*.yaml"] # relative to this file: survivors/<yyyymm>/<dd-HHMMSS>.yaml, one per run

[[source]]
name = "submissions"
license = "MIT" # this repository's license
format = "lines"
homepage = "https://github.com/feedrule/indexer/blob/develop/data/submissions.txt"
notes = "Feeds submitted to this repository directly, one per line. Read from the checkout (works while the repo is private, and reads exactly what is committed). Listed last, so a feed that is also in another list keeps that list as its source."
files = ["submissions.txt"] # relative to this file
