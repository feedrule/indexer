# Feed lists loaded into the inputs table by `indexer load-inputs`.
#
# Each source is a name, its license and the URL(s) of its list file(s). The URLs point at a
# branch, not a commit, so every load reads the lists as they are today and new feeds arrive
# on their own. A source that fails is skipped and reported; the rest still load. The inputs
# table only grows, so a broken or truncated upstream file removes nothing.
#
# The survivors source below is filled by `indexer proposals` through reviewed pull requests.
#
# To add a source, add a [[source]] block with an openly licensed list. Lists without a
# license are not used (e.g. kilimchoi/engineering-blogs, peterc/engblogs).

[licenses]
# Most permissive first; licenses in the same inner list rank equally. A URL found in several
# lists is credited to the most permissive one (on a tie, the source listed first below).
ranking = [
    ["CC0-1.0", "Unlicense", "0BSD"],
    ["MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC"],
    ["Apache-2.0"],
    ["CC-BY-4.0"],
    ["CC-BY-SA-4.0"],
    # Feeds found in Common Crawl by `indexer proposals` (its terms of use, not an open
    # license). Last, so a curated list that has the same feed takes the credit.
    ["LicenseRef-CommonCrawl-ToU"],
]

[exclude]
# Feeds on these registrable domains (and their subdomains) are never loaded: YouTube channel
# feeds and Reddit feeds are platform feeds, not the independent sites this list is for.
domains = ["youtube.com", "reddit.com"]

[commoncrawl]
# Common Crawl only (indexer proposals), not the lists below: a feed whose title contains one of
# these as a whole word, or whose subtitle and newest posts contain 3 or more, (case ignored; "porn" matches "Porn Passwords" and
# "porn-videos", not "pornography": list each form) is never proposed. Adult and sexual-violence
# content found in old crawls, gambling spam (added 2026-11-17 after casino feeds in a sample),
# warez and sponsored posts. Accents are ignored ("casino" matches "Casinò").
exclude_keywords = [
  "porn", "porno", "pornography", "pornstar", "pornstars", "xxx", "nsfw",
  "spanking", "spanked", "otk", # added 2026-11-21 after a spanking site in a proposal
  "sex", "sexy", "nude", "nudes", "nudity", "naked", "erotic", "erotica", "hentai",
  "fetish", "fetishes", "bdsm", "milf", "milfs", "escort", "escorts", "camgirl", "camgirls",
  "onlyfans", "anal", "blowjob", "handjob", "cumshot", "creampie", "pussy", "boobs", "tits",
  "gangbang", "incest", "rape", "stripper", "strippers", "hookup", "hookups",
  # gambling
  "casino", "casinos", "online casino", "gambling", "betting", "sportsbook", "bookmaker",
  "poker", "baccarat", "roulette", "blackjack", "slots", "slot online", "slot gacor", "gacor",
  "judi", "judi online", "togel", "sbobet", "maxwin", "bettor", "bettors",
  # pirated software and films (added 2026-11-21 after a warez feed)
  "crack", "cracked", "keygen", "torrent", "torrents", "camrip", "yify", "activated", "serial key",
  # sponsored posts (added 2026-11-21)
  "collab", "sponsored", "#ad",
]

